services:
  - type: web
    name: vehicle-management-system
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt && PYTHONPATH=. python manage.py collectstatic --noinput
    startCommand: PYTHONPATH=. python manage.py migrate && PYTHONPATH=. python scripts/setup_demo.py && PYTHONPATH=. python -m gunicorn vehicle_management.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vehicle-management-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: PYTHONPATH
        value: "."

databases:
  - name: vehicle-management-db
    databaseName: vehicle_management_db
    user: vehicle_management_user
    plan: free
    postgresMajorVersion: "16"
